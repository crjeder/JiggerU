<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <style>
      /* Classic: Roboto via system/CDN fallback */
      @font-face {
        font-family: "Press Start 2P";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/PressStart2P-Regular.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/PlayfairDisplay-Regular.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Playfair Display";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/PlayfairDisplay-Italic.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Quicksand";
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/Quicksand-Regular.woff2") format("woff2");
      }
    </style>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Cocktail Browser</title>

    <!-- App configuration: edit public/config.json to change theme and settings.
         Available themes: classic | c64 | speakeasy | blossom -->
    <script>
      (function () {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "/config.json", false);
          xhr.send();
          if (xhr.status === 200) {
            window.__APP_CONFIG__ = JSON.parse(xhr.responseText);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
