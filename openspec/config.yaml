project:
  name: Cocktails Browser
  desc: "@README.md"
  v: 0.1.0
  lic: GPL-3.0
  repo: https://github.com/crjeder/JiggerU
  platform: PWA

stack:
  core: [Node, React16, Hooks-only]
  state: [Redux, thunk, immer, reselect]
  ui: [MUIv4, RRDv5]
  data: [localStorage, TheCocktailDB-API]
  test: [Jest, react-test-renderer, Snapshot-focused]
  lint: [Prettier, Husky]

data_assets:
  cocktails:
    {
      p: src/data/cocktails.json,
      schema:
        [
          name,
          iba,
          colors,
          glass,
          category,
          ingredients: { ing, amt, unit },
          garnish,
          prep,
          vegan,
        ],
    }
  ingredients: { p: src/data/ingredients.json, meta: [abv, taste] }
  glasses: { p: src/data/glasses.json }

enums:
  cats: [After Dinner, All Day, Before Dinner, Hot Drink, Longdrink, Sparkling]
  glasses:
    [
      flute,
      tulip,
      collins,
      highball,
      hot-drink,
      hurricane,
      margarita,
      martini,
      old-fashioned,
      shot,
      white-wine,
    ]
  units: [parts, ml, cl, oz, pro]

features:
  filters: [byIng, byCat, byGlass, barOnly, veganOnly, ibaOnly]
  views: [card, table]
  settings: [themes, units, pro_mode]

components:
  views:
    [
      CocktailBrowser,
      CocktailList,
      CocktailCard,
      CardView,
      TableView,
      CocktailPage,
      Bar,
      Settings,
      Topbar,
    ]
  logic: [FiltersDialogs, CocktailFilter, IngredientPicker, IngredientDetail]
  hooks: [useEnrichCocktail, useScroll, useScrollTop]

rules:
  - "Functional components only"
  - "Snapshots: npm test -- -u"
  - "Tests: co-located *.spec.js"
  - "Lockfiles: Only commit on package.json change"
  - "Changelog: keepachangelog.com/en/1.1.0"

scripts:
  dev: npm start
  test: npm test
  update: npm test -- -u
  build: npm run build
